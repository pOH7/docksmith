name: Sync MinIO

on:
  schedule:
    - cron: '0 18 1 * *'
  workflow_dispatch:

jobs:
  sync:
    uses: ./.github/workflows/sync-multi-template.yml
    with:
      config: |
        {
          "version_key": "minio/minio",
          "source_repo": "minio/minio",
          "sync_type": "release",
          "components": [
            {
              "type": "dockerfile",
              "image_name": "minio",
              "dockerfile": "FROM golang:1.26 AS builder\nARG MINIO_VERSION={VERSION}\nRUN git clone --depth 1 --branch \"$MINIO_VERSION\" https://github.com/minio/minio.git /src\nWORKDIR /src\nRUN CGO_ENABLED=0 go build -tags kqueue -trimpath -ldflags \"$(MINIO_RELEASE=RELEASE go run buildscripts/gen-ldflags.go)\" -o /out/minio .\nRUN /out/minio --version | grep -F \"$MINIO_VERSION\"\n\nFROM debian:bookworm-slim\nRUN apt-get update && apt-get install -y --no-install-recommends ca-certificates curl && rm -rf /var/lib/apt/lists/*\nCOPY --from=builder /out/minio /usr/bin/minio\nCOPY --from=builder /src/dockerscripts/docker-entrypoint.sh /usr/bin/docker-entrypoint.sh\nCOPY --from=builder /src/LICENSE /licenses/LICENSE\nRUN chmod +x /usr/bin/docker-entrypoint.sh\nEXPOSE 9000 9001\nVOLUME [\"/data\"]\nENTRYPOINT [\"/usr/bin/docker-entrypoint.sh\"]\nCMD [\"minio\"]\n"
            }
          ]
        }
    secrets: inherit
